name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: cargo test --locked
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p package/deploy
          cp target/$BUILD_TARGET/release/homelab package/
          cp README.md package/
          cp deploy/* package/deploy/
          cd package
          sha256sum homelab > SHA256SUMS
          tar -czf ../homelab-$RELEASE_TAG-$BUILD_TARGET.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: '*.tar.gz'
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" *.tar.gz SHA256SUMS --verify-tag --title "Home Lab Manager $RELEASE_TAG" --notes "Single-binary Linux builds. See README.md for setup and backup instructions."
